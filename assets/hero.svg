<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 300" width="1140" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090C10"/>
      <stop offset="100%" stop-color="#11161F"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <style>
    .pulse { animation: pulseAnim 2.8s ease-in-out infinite; transform-origin: 960px 150px; }
    .ring { stroke-dasharray: 340; stroke-dashoffset: 60; animation: dashAnim 3.2s ease-in-out infinite alternate; }
    @keyframes pulseAnim { 0%, 100% { opacity: 0.25; transform: scale(0.96); } 50% { opacity: 0.6; transform: scale(1.04); } }
    @keyframes dashAnim { from { stroke-dashoffset: 130; } to { stroke-dashoffset: 38; } }
  </style>
  <rect width="1140" height="300" rx="18" fill="url(#bgGrad)" stroke="#1E2736" stroke-width="2"/>
  <circle cx="960" cy="150" r="95" fill="none" stroke="#10B981" stroke-width="2" class="pulse"/>
  <circle cx="960" cy="150" r="68" fill="none" stroke="#1E2736" stroke-width="11"/>
  <circle cx="960" cy="150" r="68" fill="none" stroke="url(#emeraldGrad)" stroke-width="11" stroke-linecap="round" transform="rotate(-90 960 150)" class="ring"/>
  <text x="960" y="156" text-anchor="middle" fill="#F1F5F9" font-family="Segoe UI, sans-serif" font-size="34" font-weight="700">96</text>
  <text x="960" y="178" text-anchor="middle" fill="#10B981" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">FRESH SCORE</text>

  <rect x="56" y="54" width="178" height="28" rx="7" fill="#0F2922" stroke="#10B981" stroke-width="1"/>
  <text x="145" y="72" text-anchor="middle" fill="#10B981" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">ZERO NUGET • .NET 8 WPF</text>

  <text x="56" y="138" fill="#F1F5F9" font-family="Segoe UI, sans-serif" font-size="44" font-weight="800">WinFresh Studio</text>
  <text x="56" y="174" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="18">Open-Source Windows 10/11 Performance &amp; Fresh-Install Restorer</text>
  <text x="56" y="218" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">✓ 100% Reversible JSON Backups   ✓ Native Win32 P/Invoke   ✓ 1-Click Restore Point</text>
</svg>
