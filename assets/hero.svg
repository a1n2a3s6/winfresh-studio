<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A0E" />
      <stop offset="55%" stop-color="#0B1418" />
      <stop offset="100%" stop-color="#081C18" />
    </linearGradient>
    <radialGradient id="freshGlow" cx="80%" cy="50%" r="44%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.30" />
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070A0E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="52%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#162226" stroke-width="0.9" />
    </pattern>
    <style>
      .ring-anim { animation: scoreBoost 4.8s ease-in-out infinite; stroke-dasharray: 440; }
      .pulse { animation: blink 1.6s ease-in-out infinite; }
      @keyframes scoreBoost {
        0%, 15% { stroke-dashoffset: 250; stroke: #F59E0B; }
        55%, 85% { stroke-dashoffset: 26; stroke: #10B981; }
        100% { stroke-dashoffset: 250; stroke: #F59E0B; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
  </defs>

  <rect width="1200" height="350" rx="20" fill="url(#bg)" />
  <rect width="1200" height="350" rx="20" fill="url(#grid)" />
  <rect width="1200" height="350" rx="20" fill="url(#freshGlow)" />
  <rect x="1" y="1" width="1198" height="348" rx="19" fill="none" stroke="#1D2B2F" stroke-width="2" />

  
  <g transform="translate(60, 44)">
    <rect width="368" height="32" rx="16" fill="#0D161A" stroke="#10B981" stroke-opacity="0.5" />
    <circle class="pulse" cx="18" cy="16" r="5" fill="#10B981" />
    <text x="34" y="21" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13" font-weight="700">OPEN-SOURCE WINDOWS SUITE // DAY 16</text>
  </g>

  
  <text x="60" y="152" fill="url(#titleGrad)" font-family="&#39;Segoe UI&#39;, sans-serif" font-size="72" font-weight="900" letter-spacing="-2">WINFRESH STUDIO</text>
  <text x="62" y="194" fill="#94A3B8" font-family="&#39;Segoe UI&#39;, sans-serif" font-size="21" font-weight="500">Make Windows 10/11 feel like a fresh install again — safely &amp; reversibly.</text>
  <text x="62" y="224" fill="#64748B" font-family="Consolas, monospace" font-size="14">Zero Ads  •  6 Root-Cause Engines  •  1-Click Restore Point &amp; Full Undo</text>

  
  <g transform="translate(60, 262)" font-family="Consolas, monospace" font-size="13" font-weight="700">
    <rect x="0" y="0" width="136" height="34" rx="8" fill="#0D161A" stroke="#1F3036" />
    <text x="16" y="22" fill="#34D399">Deep Cleaner</text>
    <rect x="148" y="0" width="146" height="34" rx="8" fill="#0D161A" stroke="#1F3036" />
    <text x="164" y="22" fill="#38BDF8">Startup Guard</text>
    <rect x="306" y="0" width="144" height="34" rx="8" fill="#0D161A" stroke="#1F3036" />
    <text x="322" y="22" fill="#FBBF24">Safe Tweaks</text>
    <rect x="462" y="0" width="154" height="34" rx="8" fill="#0D161A" stroke="#1F3036" />
    <text x="478" y="22" fill="#F8FAFC">SSD TRIM + SFC</text>
  </g>

  
  <g transform="translate(830, 55)">
    <rect width="318" height="240" rx="18" fill="#0A1015" stroke="#1F3036" stroke-width="2" />
    <circle cx="159" cy="112" r="70" fill="none" stroke="#1A242D" stroke-width="12" />
    <circle class="ring-anim" cx="159" cy="112" r="70" fill="none" stroke="#10B981" stroke-width="12" stroke-linecap="round" transform="rotate(-90 159 112)" />
    <text x="159" y="106" text-anchor="middle" fill="#FFFFFF" font-family="&#39;Segoe UI&#39;, sans-serif" font-size="38" font-weight="900">96</text>
    <text x="159" y="130" text-anchor="middle" fill="#34D399" font-family="Consolas, monospace" font-size="11" font-weight="700">FRESHNESS SCORE</text>
    <text x="159" y="212" text-anchor="middle" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">✓ 6.4 GB Freed  •  1-Click Undo Ready</text>
  </g>
</svg>
